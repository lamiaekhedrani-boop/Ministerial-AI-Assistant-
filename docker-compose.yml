services:
  db:
    image: postgres:16-alpine
    container_name: ministere_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.0
    container_name: ministere_keycloak
    restart: always
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HEALTH_ENABLED: "true"
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      KC_DB_USERNAME: ${POSTGRES_USER}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "8080:8080"
    volumes:
      - ./keycloak-data:/opt/keycloak/data/import
      - ./keycloak-theme:/opt/keycloak/themes/ministere-theme
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080;echo -e \"GET /health/ready HTTP/1.1\r\nhost: http://localhost\r\nConnection: close\r\n\r\n\" >&3;grep \"200 OK\" <&3"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: ministere_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=${POSTGRES_DB}
      - DB_USER=${POSTGRES_USER}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - KEYCLOAK_URL=http://keycloak:8080
      - KEYCLOAK_REALM=${VITE_KEYCLOAK_REALM}
      - KEYCLOAK_CLIENT_ID=${VITE_KEYCLOAK_CLIENT_ID}
      - KEYCLOAK_ADMIN_CLIENT_ID=fastapi-backend
      - KEYCLOAK_ADMIN_CLIENT_SECRET=${KEYCLOAK_ADMIN_CLIENT_SECRET}
      - RAG_BACKEND_URL=http://rag_backend:8000
    depends_on:
      db:
        condition: service_healthy
      keycloak:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        - VITE_API_URL=${VITE_API_URL}
        - VITE_KEYCLOAK_URL=${VITE_KEYCLOAK_URL}
        - VITE_KEYCLOAK_REALM=${VITE_KEYCLOAK_REALM}
        - VITE_KEYCLOAK_CLIENT_ID=${VITE_KEYCLOAK_CLIENT_ID}
    container_name: ministere_frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
      - keycloak

  rag_backend:
    image: yazidlahsaini/chatbot-v25:latest
    container_name: ministere_rag
    command: >
      sh -c "pip install rank_bm25 python-multipart &&
      sed -i 's|qwen3.6-27b|qwen/qwen3.6-27b|g' rag.py &&
      sed -i 's|gpt-oss-120b|openai/gpt-oss-120b|g' rag.py &&
      uvicorn rag:app --host 0.0.0.0 --port 8000"
    restart: always
    ports:
      - "8001:8000"
    env_file:
      - .env.rag
    environment:
      - FASTAPI_URL=http://backend:8000

volumes:
  postgres_data: